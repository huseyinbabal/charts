{{- include "cvedetector.validate" . -}}
{{- $full := include "cvedetector.fullname" . -}}
{{- if and .Values.api.enabled (not .Values.api.existingTokenSecret) }}
{{- $name := printf "%s-ingest" $full }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "cvedetector.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  token: {{ include "cvedetector.stableRandom" (dict "ctx" $ "secret" $name "key" "token") | b64enc | quote }}
{{- end }}
{{- if and .Values.agent.enabled .Values.agent.token (not .Values.agent.existingTokenSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-agent
  labels: {{- include "cvedetector.labels" . | nindent 4 }}
type: Opaque
data:
  token: {{ .Values.agent.token | b64enc | quote }}
{{- end }}
{{- if and .Values.api.enabled .Values.postgresql.enabled (not .Values.postgresql.auth.existingSecret) }}
{{- $name := printf "%s-postgresql" $full }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "cvedetector.labels" . | nindent 4 }}
  annotations:
    # Losing this password locks the API out of the existing data volume.
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{ .Values.postgresql.auth.existingSecretPasswordKey }}: {{ (.Values.postgresql.auth.password | default (include "cvedetector.stableRandom" (dict "ctx" $ "secret" $name "key" .Values.postgresql.auth.existingSecretPasswordKey))) | b64enc | quote }}
{{- end }}
{{- if and .Values.api.enabled (not .Values.postgresql.enabled) .Values.externalDatabase.password (not .Values.externalDatabase.existingSecret) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $full }}-externaldb
  labels: {{- include "cvedetector.labels" . | nindent 4 }}
type: Opaque
data:
  {{ .Values.externalDatabase.existingSecretPasswordKey }}: {{ .Values.externalDatabase.password | b64enc | quote }}
{{- end }}
