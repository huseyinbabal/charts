{{- if and .Values.api.enabled .Values.postgresql.enabled }}
{{- $name := printf "%s-postgresql" (include "cvedetector.fullname" .) }}
{{- $c := dict "ctx" $ "component" "postgresql" }}
{{- $pg := .Values.postgresql }}
# Bundled single-instance PostgreSQL (official image). For production HA use a
# managed database or an operator (e.g. CloudNativePG) via externalDatabase.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {{- include "cvedetector.componentLabels" $c | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels: {{- include "cvedetector.componentSelector" $c | nindent 6 }}
  template:
    metadata:
      labels: {{- include "cvedetector.componentSelector" $c | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        # uid/gid 70 is "postgres" in the alpine image.
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgresql
          image: "{{ $pg.image.repository }}:{{ $pg.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              value: {{ $pg.auth.database | quote }}
            - name: POSTGRES_USER
              value: {{ $pg.auth.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "cvedetector.dbSecret" . }}
                  key: {{ include "cvedetector.dbSecretKey" . }}
            # A subdirectory, so the volume's lost+found doesn't block initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.auth.username | quote }}, "-d", {{ $pg.auth.database | quote }}, "-h", "127.0.0.1"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", {{ $pg.auth.username | quote }}, "-d", {{ $pg.auth.database | quote }}, "-h", "127.0.0.1"]
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml $pg.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: run, mountPath: /var/run/postgresql }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        {{- if not $pg.persistence.enabled }}
        - { name: data, emptyDir: {} }
        {{- end }}
      {{- with $pg.nodeSelector }}
      nodeSelector: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.tolerations }}
      tolerations: {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $pg.affinity }}
      affinity: {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if $pg.persistence.enabled }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels: {{- include "cvedetector.componentSelector" $c | nindent 10 }}
      spec:
        accessModes: [ReadWriteOnce]
        {{- with $pg.persistence.storageClass }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ $pg.persistence.size }}
  {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels: {{- include "cvedetector.componentLabels" $c | nindent 4 }}
spec:
  selector: {{- include "cvedetector.componentSelector" $c | nindent 4 }}
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
{{- end }}
